[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Waxwing Voice: real-time voice pipeline for property management"
requires-python = ">=3.12"
dependencies = [
    # Telephony bridge (Twilio webhook parsing) — Phase 1 will add twilio SDK
    "twilio>=9.0.0",
    # Voice orchestration — LiveKit Agents framework (ADR-0004: Twilio→LiveKit bridge)
    "livekit-agents>=0.10",
    # TTS — ElevenLabs Turbo v2.5 via official LiveKit plugin (ADR-0001)
    # livekit-plugins-elevenlabs provides the LiveKit Agents TTS integration.
    # ElevenLabsTTSAdapter also uses httpx directly for streaming — no extra dep.
    "livekit-plugins-elevenlabs>=0.3.0",
    # STT — Whisper via openai-whisper or faster-whisper (Phase 1 decision)
    # Using faster-whisper for lower latency; locked to Whisper model family
    "faster-whisper>=1.0.0",
    # LLM — Gemini-3.0 Flash via Google Generative AI SDK
    "google-generativeai>=0.8.0",
    # HTTP client for backend tool calls (Harsha's FastAPI endpoints)
    # Also used by ElevenLabsTTSAdapter for streaming TTS WebSocket calls.
    "httpx>=0.27.0",
    # Pydantic v2 for call state models and tool payload validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Structured logging (PII-safe)
    "structlog>=24.1.0",
    # Async support utilities
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",  # also used in tests for mocking
]

[project.scripts]
voice-agent = "voice_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (matches repo-wide tooling decision in docs/03)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["voice_agent", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # type annotations (warn, not block)
]
ignore = [
    "ANN101",  # missing type for self
    "ANN102",  # missing type for cls
    "ANN401",  # allow Any where genuinely needed
]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["voice_agent"]
omit = ["tests/*", "voice_agent/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
