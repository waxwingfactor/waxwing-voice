[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Waxwing Voice: real-time voice pipeline for property management"
requires-python = ">=3.12"
dependencies = [
    # Telephony bridge (Twilio webhook parsing)
    "twilio>=9.0.0",
    # Voice orchestration — LiveKit Agents framework (ADR-0004, ADR-0006)
    "livekit-agents>=0.10",
    # STT — Deepgram nova-2-phonecall via official LiveKit plugin (ADR-0005)
    # Replaces faster-whisper. streaming-first, ~150ms TTFT, telephony-tuned.
    "livekit-plugins-deepgram>=0.6.0",
    # VAD — Silero VAD, bundled with LiveKit Agents but listed explicitly.
    "livekit-plugins-silero>=0.6.0",
    # LLM — Gemini Flash via official LiveKit plugin (ADR-0006)
    # Replaces google-generativeai direct SDK.
    "livekit-plugins-google>=0.2.0",
    # TTS — ElevenLabs Turbo v2.5 via official LiveKit plugin (ADR-0001)
    "livekit-plugins-elevenlabs>=0.3.0",
    # HTTP client for backend tool calls (Harsha's FastAPI endpoints)
    "httpx>=0.27.0",
    # Pydantic v2 for call state models and tool payload validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Structured logging (PII-safe)
    "structlog>=24.1.0",
    # Async support utilities
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",  # also used in tests for mocking
]

[project.scripts]
voice-agent = "voice_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (matches repo-wide tooling decision in docs/03)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["voice_agent", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # type annotations (warn, not block)
]
ignore = [
    "ANN101",  # missing type for self
    "ANN102",  # missing type for cls
    "ANN401",  # allow Any where genuinely needed
]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["voice_agent"]
omit = ["tests/*", "voice_agent/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
